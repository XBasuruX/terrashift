<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .bg { fill: #f1f4f0; }
      .cadastre { fill: #e5ece2; stroke: #bdd1b9; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .urban { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; }
      .woodland { fill: #c7eed3; fill-opacity: 0.6; stroke: #86efac; stroke-width: 1; }
      .water { fill: #bae6fd; stroke: #38bdf8; stroke-width: 1.5; }
      .road-prim-casing { stroke: #e29b14; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .road-prim { stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .road-sec-casing { stroke: #94a3b8; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .road-sec { stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .road-track { stroke: #94a3b8; stroke-width: 1.8; stroke-dasharray: 4,3; fill: none; }
      .place-badge { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 5; }
      .place-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 800; fill: #1e293b; letter-spacing: 0.08em; text-anchor: middle; }
      .sub-badge { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .street-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #334155; }
      .cadastre-num { font-family: monospace; font-size: 9px; fill: #64748b; font-weight: bold; }
    </style>
  </defs>

  <!-- Background Landmass -->
  <rect width="1000" height="700" class="bg" />

  <!-- Cadastral Farm Plots -->
  <polygon points="40,40 150,45 140,200 30,190" class="cadastre" />
  <polygon points="160,45 350,55 340,195 150,190" class="cadastre" />
  <polygon points="360,50 600,60 590,230 350,220" class="cadastre" />
  <polygon points="610,55 800,65 790,220 600,210" class="cadastre" />
  <polygon points="810,60 970,70 960,260 800,250" class="cadastre" />
  <polygon points="40,210 145,215 130,450 30,440" class="cadastre" />
  <polygon points="40,460 160,465 140,680 30,670" class="cadastre" />
  <polygon points="600,240 760,250 740,330 580,320" class="cadastre" />
  <polygon points="770,490 950,500 930,680 750,670" class="cadastre" />

  <!-- Water: River Stura di Demonte -->
  <path d="M 740 700 Q 820 660, 920 630 T 1000 590 L 1000 700 Z" class="water" />
  <path d="M 740 680 Q 820 640, 920 610 T 1000 570" stroke="#0284c7" stroke-width="2.5" fill="none" />
  <text x="860" y="665" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1" transform="rotate(-12, 860, 665)">Fiume Stura di Demonte</text>

  <!-- Irrigation Canal: Canale Idrovora -->
  <path d="M 80 485 Q 240 495, 382 507 T 720 545 T 1000 540" stroke="#38bdf8" stroke-width="3" fill="none" />
  <text x="180" y="478" font-family="sans-serif" font-size="9" font-weight="600" fill="#0284c7">Canale Idrovora</text>

  <!-- Woodlands -->
  <path d="M 500 40 Q 560 50, 550 100 Q 520 120, 480 80 Z" class="woodland" />
  <path d="M 380 250 Q 360 300, 370 380 Q 390 320, 385 270 Z" class="woodland" />
  <path d="M 570 350 Q 590 400, 580 470 Q 565 420, 570 370 Z" class="woodland" />

  <!-- Urban clusters: Confreria & Cerialdo -->
  <polygon points="420,530 580,540 570,680 430,670" class="urban" />
  <polygon points="760,330 920,340 910,480 750,470" class="urban" />
  <polygon points="450,110 540,115 530,175 440,170" class="urban" />

  <!-- Arterial roads: SP422 / SS705 -->
  <path d="M 0 500 Q 180 503, 382 507 T 740 550 T 1000 530" class="road-prim-casing" fill="none" />
  <path d="M 0 500 Q 180 503, 382 507 T 740 550 T 1000 530" class="road-prim" fill="none" />

  <!-- Roundabouts -->
  <circle cx="382" cy="507" r="14" fill="#e29b14" />
  <circle cx="382" cy="507" r="8" fill="#ffffff" />
  <circle cx="382" cy="507" r="4" fill="#22c55e" />

  <circle cx="740" cy="550" r="14" fill="#e29b14" />
  <circle cx="740" cy="550" r="8" fill="#ffffff" />

  <!-- Secondary Roads: Via Concadalbero & Via Ercole Oldofredi Tadini -->
  <path d="M 382 507 L 380 320 L 375 140 L 370 0" class="road-sec-casing" fill="none" />
  <path d="M 382 507 L 380 320 L 375 140 L 370 0" class="road-sec" fill="none" />

  <path d="M 382 507 Q 480 450, 610 350 T 800 240 T 1000 120" class="road-sec-casing" fill="none" />
  <path d="M 382 507 Q 480 450, 610 350 T 800 240 T 1000 120" class="road-sec" fill="none" />

  <!-- Local Farm Tracks -->
  <path d="M 160 210 L 370 215" class="road-track" />
  <path d="M 140 420 L 365 425" class="road-track" />
  <path d="M 380 250 L 580 255" class="road-track" />
  <path d="M 375 490 L 570 495" class="road-track" />
  <path d="M 450 100 L 580 105" class="road-track" />
  <path d="M 440 230 L 575 235" class="road-track" />

  <!-- Street Labels -->
  <text x="250" y="495" class="street-txt">SP422 (Strada Provinciale 422)</text>
  <text x="365" y="300" class="street-txt" transform="rotate(-90, 365, 300)">Via Concadalbero</text>
  <text x="470" y="435" class="street-txt" transform="rotate(-35, 470, 435)">Via Ercole Oldofredi Tadini</text>
  <text x="820" y="540" class="street-txt">SS705 (Tangenziale Ovest Cuneo)</text>

  <!-- Town Labels -->
  <g transform="translate(480, 630)">
    <rect x="-65" y="-14" width="130" height="28" class="place-badge" />
    <text x="0" y="4" class="place-text">CONFRERIA</text>
  </g>
  <g transform="translate(830, 420)">
    <rect x="-55" y="-14" width="110" height="28" class="place-badge" />
    <text x="0" y="4" class="place-text">CERIALDO</text>
  </g>
  <g transform="translate(510, 150)">
    <rect x="-50" y="-12" width="100" height="24" class="sub-badge" />
    <text x="0" y="4" class="sub-text">Tetto Patta</text>
  </g>
  <g transform="translate(210, 210)">
    <rect x="-50" y="-12" width="100" height="24" class="sub-badge" />
    <text x="0" y="4" class="sub-text">Tetto Farina</text>
  </g>
  <g transform="translate(700, 310)">
    <rect x="-65" y="-12" width="130" height="24" class="sub-badge" />
    <text x="0" y="4" class="sub-text">Villa Oldofredi Tadini</text>
  </g>

  <!-- Cadastral identifiers -->
  <text x="410" y="280" class="cadastre-num">Fgl. 42 / Part. 104</text>
  <text x="200" y="240" class="cadastre-num">Fgl. 42 / Part. 88</text>
  <text x="470" y="120" class="cadastre-num">Fgl. 41 / Part. 32</text>
  <text x="640" y="370" class="cadastre-num">Fgl. 42 / Part. 119</text>
  <text x="330" y="550" class="cadastre-num">Fgl. 43 / Part. 210</text>
</svg>